extensions:
  bearertokenauth/genkey_observation_client:
    filename: ./.bearertokenauth_genkey_observation_client.txt

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 10s
    scrapers:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
        cpu_average: true
      network:
        exclude:
          match_type: regexp
          interfaces:
            - lo
            - flannel.*
            - cali.*
            - tunl.*
            - vxlan.calico
            - vxlan-v6.calico
            - wireguard.cali
            - wg-v6.cali
            - docker.*
            - veth.*
            - vnet.*

  hostmetrics/disk:
    root_path: /
    collection_interval: 1m
    scrapers:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        exclude_mount_points:
          match_type: regexp
          mount_points:
            - "/var/lib/docker.*"
            - "/var/lib/kubelet.*"
            - "/var/lib/containers.*"
        exclude_fs_types:
          match_type: strict
          fs_types:
            - "tmpfs"
            - "devtmpfs"
            - "overlay"
            - "iso9660"

exporters:
  debug/verbosity:
    verbosity: detailed
  otlp_grpc/genkey_observation:
    endpoint: "https://observation.genkey.com:4317"
    auth:
      authenticator: bearertokenauth/genkey_observation_client
processors:
  resource:
    attributes:
      - key: deployment.environment.name
        value: "${env:DEPLOYMENT_ENVIRONMENT_NAME}"
        action: insert
      - key: service.namespace
        value: linux-native
        action: insert
      - key: service.name
        value: opentelemetry-collector
        action: insert
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
  resourcedetection:
    detectors: [ "system" ]
    system:
      hostname_sources: [ "os" ]
      resource_attributes:
        host.name:
          enabled: true
  transform:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["host.name"], resource.attributes["host.name"])

service:
  extensions: [ bearertokenauth/genkey_observation_client ]
  pipelines:
    metrics:
      receivers: [ hostmetrics, hostmetrics/disk ]
      processors: [ memory_limiter, batch, resourcedetection, transform, resource ]
      exporters: [ otlp_grpc/genkey_observation  ]
    metrics/otlp:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp_grpc/genkey_observation ]
    logs/otlp:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp_grpc/genkey_observation ]
    traces/otlp:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp_grpc/genkey_observation ]
  telemetry:
    metrics:
      level: none
      readers: [ ]
